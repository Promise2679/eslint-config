name: ci

on:
  # eslint-disable-next-line yml/no-empty-mapping-value
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3
        with:
          runtime: node@24
          cache: true

      - name: Typegen
        run: pnpm typegen

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck
